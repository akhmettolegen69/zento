{% load zento %}{% if page.has_other_pages %}<div class="pager">
  {% if page.has_previous %}<a class="btn btn-gray" href="?{% qs page=page.previous_page_number %}">‹</a>{% endif %}
  <span class="muted">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-gray" href="?{% qs page=page.next_page_number %}">›</a>{% endif %}
</div>{% endif %}
