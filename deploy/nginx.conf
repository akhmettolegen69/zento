# /etc/nginx/sites-available/zento  (replace zentoit.tech)
server {
    listen 80;
    server_name zentoit.tech www.zentoit.tech;
    client_max_body_size 10M;

    location /static/ { alias /srv/zento/staticfiles/; expires 7d; }
    location /media/  { alias /srv/zento-data/media/;  expires 7d; }

    location / {
        proxy_pass http://unix:/run/zento/zento.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
